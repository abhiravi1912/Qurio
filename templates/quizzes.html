{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

<h2 class="mb-4">📚 Quizzes</h2>

<div class="row">

{% for quiz in quizzes %}

<div class="col-md-4 mb-4">

<div class="card shadow-sm h-100">

<div class="card-body d-flex flex-column">

<h5 class="card-title">
{{ quiz.title }}
</h5>

<p class="text-muted flex-grow-1">
{{ quiz.description }}
</p>

<div class="mt-3">

<a href="{{ url_for('main.take_quiz', quiz_id=quiz.id) }}"
class="btn btn-primary btn-sm me-2">
Take Quiz
</a>

{% if current_user.role == "faculty" %}

<a href="{{ url_for('main.view_submissions', quiz_id=quiz.id) }}"
class="btn btn-outline-secondary btn-sm">
Submissions
</a>

{% endif %}

</div>

</div>

</div>

</div>

{% else %}

<div class="text-center p-5">

<h5 class="text-muted">No quizzes available</h5>

<p class="text-muted">Create a quiz to get started.</p>

</div>

{% endfor %}

</div>

</div>

{% endblock %}
