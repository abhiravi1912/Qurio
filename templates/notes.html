{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

<h2 class="mb-4">Available Notes</h2>

<div class="row">

{% for note in notes %}

<div class="col-md-4 mb-4">

<div class="card shadow-sm h-100">

<div class="card-body d-flex flex-column">

<h5 class="card-title">
📄 {{ note.title }}
</h5>

<p class="text-muted mb-2">
Subject: <span class="badge bg-secondary">{{ note.category }}</span>
</p>

<p class="text-muted">
Uploaded by Faculty ID {{ note.faculty_id }}
</p>

<div class="mt-auto">

<a href="{{ url_for('main.note_detail', note_id=note.id) }}"
class="btn btn-primary btn-sm">
View Note
</a>

</div>

</div>

</div>

</div>

{% else %}

<div class="text-center p-5">

<h5 class="text-muted">No notes available yet</h5>
<p class="text-muted">Faculty will upload notes soon.</p>

</div>

{% endfor %}

</div>

</div>

{% endblock %}
