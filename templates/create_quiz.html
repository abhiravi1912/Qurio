{% extends "layout.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow-lg p-4">

<h3 class="text-center mb-4">Create Quiz</h3>

<form method="POST">

<!-- TITLE -->

<div class="mb-3">
<label class="form-label">Quiz Title</label>
<input type="text" name="title" class="form-control" placeholder="Enter quiz title" required>
</div>

<hr>

<!-- QUESTIONS -->

<h5 class="mb-3">Questions</h5>

<div id="questions">

<div class="question-block mb-3">

<label class="form-label">Question 1</label>

<textarea name="questions[]" class="form-control"
rows="3" placeholder="Enter question"></textarea>

</div>

</div>

<!-- ADD BUTTON -->

<button type="button" onclick="addQuestion()" class="btn btn-outline-primary mb-3">
Add Question
</button>

<!-- SUBMIT -->

<div class="d-grid">
<button type="submit" class="btn btn-primary btn-lg">
Create Quiz
</button>
</div>

</form>

</div>

</div>

</div>

</div>

<!-- SCRIPT -->

<script>

function addQuestion() {

let container = document.getElementById("questions");

let count = container.children.length + 1;

let newField = document.createElement("div");
newField.classList.add("question-block", "mb-3");

newField.innerHTML = `
<label class="form-label">Question ${count}</label>
<textarea name="questions[]" class="form-control"
rows="3" placeholder="Enter question"></textarea>
`;

container.appendChild(newField);

}

</script>

{% endblock %}
