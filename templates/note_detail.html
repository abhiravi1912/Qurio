{% extends "layout.html" %}

{% block content %}

<h2>{{ note.title }}</h2>

<p>{{ note.content }}</p>

<hr>

<h3>Comments</h3>

{% for comment in comments %}

<p>
{{ comment.content }}
</p>

{% endfor %}

<hr>

<h3>Add Comment</h3>

<form method="POST">

{{ form.hidden_tag() }}

<p>
{{ form.content }}
</p>

<p>
{{ form.submit }}
</p>

</form>

{% endblock %}
